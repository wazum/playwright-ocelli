name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ./scripts/smoke-package.sh

  # The test suite needs a Node new enough to strip TypeScript, so it can never
  # run on the oldest Node the package claims. The built tarball can, and that
  # is what someone on that Node installs.
  floor-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Installed outside the project on purpose. In node_modules/.bin it would
      # join the PATH of every later npm run, and devEngines then refuses the
      # build outright with EBADDEVENGINES.
      - name: Fetch the lowest Node the engines field allows
        run: |
          floor=$(node -p "require('./package.json').engines.node.match(/\d+\.\d+/)[0]")
          echo "importing with node@$floor"
          npm install --no-save --prefix "$RUNNER_TEMP/node-floor" "node@$floor"
      - run: ./scripts/smoke-package.sh "$RUNNER_TEMP/node-floor/node_modules/.bin/node"

  # Every other job drives the reporter with a fake screen. This one lets real
  # Playwright produce the diffs, so attachment naming and the list output
  # ocelli indents against are covered too.
  demo:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Only the darwin baselines are committed, so the linux ones are written
      # here for the runs below to differ from.
      - run: npm run demo:baseline
      - name: A failing screenshot prints its summary, image and closing line
        run: |
          npm run demo >demo.log 2>&1 || true
          cat demo.log
          grep -q 'px different' demo.log
          grep -q '▀' demo.log
          grep -q 'snapshots differ · accept with' demo.log
      - name: A frame that changed size is named as such
        env:
          DEMO_VIEWPORT_HEIGHT: '300'
        run: |
          npm run demo >resized.log 2>&1 || true
          cat resized.log
          grep -q 'size differs · expected 480×240, got 480×300' resized.log

  # The lockfile pins whatever the devDependency resolved to, which drifts away
  # from the floor the peer range promises. This job installs the promise.
  floor-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install the lowest Playwright the peer range allows
        run: |
          floor=$(node -p "require('./package.json').peerDependencies['@playwright/test'].match(/\d+\.\d+\.\d+/)[0]")
          echo "installing @playwright/test@$floor"
          npm install --no-save "@playwright/test@$floor"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ./scripts/smoke-package.sh
